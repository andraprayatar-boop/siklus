<div class="section-heading"><div><h2>Aktivitas terbaru</h2><p>Pergerakan uang yang kamu catat.</p></div>${btn('Semua transaksi','goto-transactions','btn btn-small')}</div><div class="card">${recent.length?`<div class="list">${recent.map(t=>`<div class="list-row"><div class="row-icon">${iconSvg(txIcon(t))}</div><div class="row-main"><div class="row-title">${escapeHtml(t.name||txLabel(t))}</div><div class="row-desc">${escapeHtml(txDesc(t))} · ${fmtDate(getTxDate(t))}</div></div><div class="row-amount ${txSignedValue(t)>0?'amount-positive':txSignedValue(t)<0?'amount-negative':''}">${t.type==='transfer'?'⇄ ':t.type==='creditExpense'?'• ':txSign(t)}${m(t.type==='correction'?Math.abs(Number(t.signedAmount)||0):Number(t.amount)||0)}</div></div>`).join('')}</div>`:empty('Belum ada transaksi','Catat uang yang masuk atau keluar untuk mulai melihat pola keuangan.',btn('Catat transaksi','add-transaction','btn btn-primary'))}</div>
${data.settings.dashboardSections.notes?`<div class="section-heading"><div><h2>Catatan dashboard</h2><p>Hanya catatan yang kamu pilih untuk tampil di ringkasan.</p></div>${btn('Atur catatan','goto-notes','btn btn-small')}</div><div class="grid grid-3">${notes.length?notes.map(noteCard).join(''):empty('Dashboard masih lega','Tandai catatan agar terlihat di sini.',btn('Buat catatan','add-note','btn btn-small'))}</div>`:''}

function noteCard(n){const items=Array.isArray(n.checklist)?n.checklist:[];const done=items.filter(i=>i.done).length;return `<div class="note-card"><div class="note-card-head"><div class="note-card-title">${n.pinned?'★ ':''}${escapeHtml(n.title||'Tanpa judul')}</div><span class="tag">${n.type==='dashboard'?'Dashboard':n.type==='essential'?'Essential':'Bebas'}</span></div>${n.body?`<div class="note-card-body">${escapeHtml(n.body)}</div>`:''}${items.length?`<div class="checklist">${items.slice(0,5).map((i,j)=>`<label><input type="checkbox" data-act="toggle-check" data-id="${n.id}" data-index="${j}" ${i.done?'checked':''}> <span style="${i.done?'text-decoration:line-through;opacity:.6':''}">${escapeHtml(i.text)}</span></label>`).join('')}</div><div class="small-muted" style="margin-top:8px">${done}/${items.length} selesai${n.recurrence?` · ${n.recurrence==='daily'?'harian':n.recurrence==='monthly'?'bulanan':'tanpa pengulangan'}`:''}</div>`:''}${n.history&&Object.keys(n.history).length?`<details style="margin-top:10px;font-size:10px;color:var(--muted)"><summary>Riwayat periode (${Object.keys(n.history).length})</summary>${Object.entries(n.history).sort((a,b)=>b[0].localeCompare(a[0])).map(([period,checks])=>`<div style="padding:7px 0;border-bottom:1px solid var(--line)"><strong>${escapeHtml(period)}</strong><div>${checks.map(c=>`${c.done?'✓':'○'} ${escapeHtml(c.text)}`).join('<br>')}</div></div>`).join('')}</details>`:''}<div class="note-actions">${btn('Ubah','edit-note','btn btn-small',`data-id="${n.id}"`)}${btn('Hapus','delete-note','btn btn-small btn-danger',`data-id="${n.id}"`)}</div></div>`}
function txTableRow(t){const value=t.type==='correction'?Math.abs(Number(t.signedAmount)||0):Number(t.amount)||0;let label=txLabel(t);const sign=txSign(t);let cls=['income','refund','borrow','lendReturn'].includes(t.type)?'amount-positive':['expense','debtPayment','lend','creditPayment'].includes(t.type)?'amount-negative':'';if(t.type==='creditExpense')cls='';return `<tr><td><div class="row-title">${escapeHtml(t.name||label)}</div><div class="row-desc">${escapeHtml(txDesc(t))}</div></td><td>${fmtDate(getTxDate(t))}</td><td><span class="tag">${escapeHtml(label)}</span></td><td><span class="pill ${t.status==='pending'?'warn':'good'}">${t.status==='pending'?'Menunggu':'Tercatat'}</span></td><td style="text-align:right" class="${cls}">${sign} ${m(value)}</td><td><div class="table-actions">${t.status==='pending'?btn(iconSvg('check'),'confirm-tx','btn btn-small',`data-id="${t.id}" title="Konfirmasi selesai"`):''}${btn(iconSvg('edit'),'edit-tx','btn btn-small',`data-id="${t.id}" title="Ubah"`)}${btn(iconSvg('trash'),'delete-tx','btn btn-small btn-danger',`data-id="${t.id}" title="Hapus"`)}</div></td></tr>`}
function filteredTxs(){return [...data.transactions].filter(t=>{const date=getTxDate(t);if(txFilters.q&&!(`${t.name||''} ${t.note||''} ${t.category||''} ${txLabel(t)}`).toLowerCase().includes(txFilters.q.toLowerCase()))return false;if(txFilters.type!=='all'&&t.type!==txFilters.type)return false;if(txFilters.category!=='all'&&t.category!==txFilters.category&&!(Array.isArray(t.splits)&&t.splits.some(s=>s.category===txFilters.category)))return false;if(txFilters.status!=='all'&&(txFilters.status==='pending'?!isPending(t):isPending(t)))return false;if(txFilters.from&&date<txFilters.from)return false;if(txFilters.to&&date>txFilters.to)return false;return true}).sort((a,b)=>getTxDate(b).localeCompare(getTxDate(a))||String(b.createdAt||'').localeCompare(String(a.createdAt||'')))}
function transactionsHtml(){const txs=filteredTxs();return `<div class="card"><div class="card-title-row"><div><h2 class="card-title">Buku transaksi</h2><p class="card-subtitle">Transaksi tertunda tidak mengubah saldo aktual sampai dikonfirmasi.</p></div><div class="section-actions">${btn('Ekspor CSV','export-csv','btn btn-small')}${btn('Catat transaksi','add-transaction','btn btn-primary')}</div></div><div class="filters"><label class="field" style="flex:2;min-width:160px"><span class="sr-only">Cari transaksi</span><input class="input" id="txSearch" placeholder="Cari nama atau catatan…" value="${escapeHtml(txFilters.q)}"></label><label class="field" style="flex:1;min-width:130px"><span class="sr-only">Jenis transaksi</span><select id="txFilterType" class="input"><option value="all">Semua jenis</option>${['income','expense','transfer','refund','borrow','debtPayment','lend','lendReturn','creditExpense','creditPayment','correction'].map(t=>`<option value="${t}" ${txFilters.type===t?'selected':''}>${txLabel({type:t})}</option>`).join('')}</select></label><label class="field" style="flex:1;min-width:130px"><span class="sr-only">Kategori</span><select id="txCategory" class="input"><option value="all">Semua kategori</option>${[...new Set([...expenseCats(),...incomeCats()])].map(c=>`<option ${txFilters.category===c?'selected':''}>${escapeHtml(c)}</option>`).join('')}</select></label><label class="field" style="flex:1;min-width:120px"><span class="sr-only">Status transaksi</span><select id="txStatus" class="input"><option value="all">Semua status</option><option value="pending" ${txFilters.status==='pending'?'selected':''}>Menunggu</option><option value="posted" ${txFilters.status==='posted'?'selected':''}>Tercatat</option></select></label><label class="field" style="min-width:130px"><span class="sr-only">Dari tanggal</span><input id="txFrom" class="input" type="date" value="${txFilters.from}" aria-label="Dari tanggal"></label><label class="field" style="min-width:130px"><span class="sr-only">Sampai tanggal</span><input id="txTo" class="input" type="date" value="${txFilters.to}" aria-label="Sampai tanggal"></label>${btn('Reset filter','reset-tx-filters','btn btn-small')}</div><div class="table-wrap">${txs.length?`<table><thead><tr><th>Transaksi</th><th>Tanggal</th><th>Jenis</th><th>Status</th><th style="text-align:right">Nominal</th><th></th></tr></thead><tbody id="txRows">${txs.map(txTableRow).join('')}</tbody></table>`:`${empty('Tidak ada transaksi yang cocok','Ubah filter atau buat transaksi baru.')}`}</div><div class="small-muted" style="margin-top:12px">${txs.length} transaksi ditampilkan · Pemasukan yang belum diterima dan catatan rancangan tidak dihitung ke saldo.</div></div><div class="section-heading"><div><h2>Ringkasan bulan ini</h2><p>Perhitungan dari transaksi yang sudah dikonfirmasi.</p></div></div><div class="grid grid-3">${metricCard('Pemasukan',m(incomesInRange(startOfMonth(thisMonth()),endOfMonth(thisMonth()))),'Tidak termasuk pinjaman','download')}${metricCard('Pengeluaran bersih',m(expensesInRange(startOfMonth(thisMonth()),endOfMonth(thisMonth()))),'Setelah pengembalian yang tertaut','trend')}${metricCard('Transaksi menunggu',String(data.transactions.filter(isPending).length),'Belum memengaruhi saldo aktual','clock')}</div>`}
function budgetsHtml(){const month=appBudgetMonth||thisMonth();const budgets=data.budgets.filter(b=>b.month===month);const weekStart=new Date();weekStart.setDate(weekStart.getDate()-((weekStart.getDay()+6)%7));const weekFrom=localDate(weekStart);const weekSpend=expensesInRange(weekFrom,today());const totalBudget=sum(budgets.map(b=>Number(b.limit)||0));const totalSpent=sum(budgets.map(b=>spentCategory(b.category,startOfMonth(month),endOfMonth(month))));return `<div class="banner">${iconSvg('help')}<div><strong>Anggaran adalah batas, bukan pengeluaran.</strong><div style="margin-top:3px">Nominal batas tidak mengurangi saldo. Pengeluaran dihitung hanya dari transaksi yang sudah dikonfirmasi, termasuk belanja dengan utang.</div></div></div><div class="section-heading"><div><h2>Anggaran bulanan</h2><p>Anggaran diatur per kategori; kategori yang belum punya batas tetap tercatat.</p></div><div class="section-actions"><div class="month-controls">${btn('‹','budget-prev','btn btn-small') }<strong>${monthTitle(month)}</strong>${btn('›','budget-next','btn btn-small')}</div>${btn('Tambah anggaran','add-budget','btn btn-primary')}</div></div><div class="grid grid-3">${metricCard('Total batas',m(totalBudget),'Tidak memotong saldo','wallet')}${metricCard('Pengeluaran kategori',m(totalSpent),'Periode terpilih','trend')}${metricCard('Sisa batas',m(totalBudget-totalSpent),totalSpent>totalBudget?'Batas total sudah terlewati':'Perkiraan ruang anggaran','target',totalBudget-totalSpent<0?'amount-negative':'')}</div><div class="section-heading"><div><h2>Per kategori</h2><p>Garis berubah merah ketika pengeluaran melewati batas.</p></div></div><div class="grid grid-2">${budgets.length?budgets.map(b=>{const spent=expensesInRange(startOfMonth(month),endOfMonth(month),b.category);const pct=b.limit?clamp(spent/b.limit*100,0,100):0;const carry=b.carryIn||0;return `<div class="card"><div class="card-title-row"><div><h3 class="card-title">${escapeHtml(b.category)}</h3><p class="card-subtitle">${b.carryIn?`Termasuk sisa batas dibawa ${m(carry)}`:'Batas periode ini'}</p></div><div class="progress-ring" style="--p:${pct}%" data-value="${Math.round(b.limit?spent/b.limit*100:0)}%"></div></div><div style="display:flex;justify-content:space-between;align-items:baseline;gap:12px"><strong style="font-size:19px">${m(spent)}</strong><span class="small-muted">dari ${m(b.limit)}</span></div><div class="bar-track" style="margin-top:12px"><div class="bar-fill ${spent>b.limit?'over':''}" style="width:${pct}%"></div></div><div class="small-muted" style="margin-top:9px">${spent>b.limit?`Melewati batas ${m(spent-b.limit)}`:`Tersisa ${m(b.limit-spent)}`}</div><div class="form-actions" style="margin-top:14px">${btn('Ubah','edit-budget','btn btn-small',`data-id="${b.id}"`)}${btn('Hapus','delete-budget','btn btn-small btn-danger',`data-id="${b.id}"`)}</div></div>`}).join(''):empty('Belum ada anggaran','Mulai dengan batas bulanan untuk kategori yang paling penting.',btn('Buat anggaran','add-budget','btn btn-primary'))}</div><div class="section-heading"><div><h2>Batas mingguan opsional</h2><p>Lebih cocok untuk menjaga laju belanja jangka pendek.</p></div>${btn('Atur batas mingguan','weekly-limit','btn btn-small')}</div><div class="card"><div class="grid grid-2"><div><div class="eyebrow">Batas mingguan</div><div class="metric-value">${m(Number(data.settings.weeklyLimit)||0)}</div><div class="metric-note">${data.settings.weeklyLimit?'Sisa dari catatan pekan ini: '+m(Number(data.settings.weeklyLimit)-weekSpend):'Belum diatur; tidak ada batas mingguan aktif.'}</div></div><div><div class="eyebrow">Pengeluaran minggu ini</div><div class="metric-value">${m(weekSpend)}</div><div class="metric-note">Senin hingga hari ini. Ini hanya panduan, bukan kunci transaksi.</div></div></div></div><div class="section-heading"><div><h2>Aturan anggaran</h2><p>Pilihan yang kita sepakati.</p></div></div><div class="card"><div class="list-row"><div class="row-main"><div class="row-title">Sisa anggaran dibawa ke bulan berikutnya</div><div class="row-desc">Hanya untuk kategori yang dipilih. Ini menambah batas anggaran, bukan saldo uang.</div></div><span class="pill">Opsional</span></div><div class="small-muted" style="margin-top:10px">Saat membuat atau mengubah anggaran, centang pilihan untuk membawa sisa batas bulan lalu. Transaksi lama tidak berubah.</div></div>`}

function obligationCard(o){return `<div class="list-row"><div class="row-icon">${iconSvg(o.kind==='annual'?'calendar':'clock')}</div><div class="row-main"><div class="row-title">${escapeHtml(o.name)}</div><div class="row-desc">${o.dueDate?fmtDate(o.dueDate):'Tanggal belum ditentukan'} · ${escapeHtml(o.category||'Kebutuhan')}${o.isEstimate?' · nominal perkiraan':''}${o.recurring?` · berulang ${o.frequency==='yearly'?'tahunan':o.frequency==='weekly'?'mingguan':'bulanan'}`:''}</div></div><div style="text-align:right"><div class="row-amount">${m(Number(o.estimatedAmount??o.amount)||0)}</div><div class="section-actions" style="justify-content:flex-end;margin-top:6px">${btn('Lunasi','pay-obligation','btn btn-small',`data-id="${o.id}"`)}${btn(iconSvg('edit'),'edit-obligation','btn btn-small',`data-id="${o.id}" title="Ubah"`)}${btn(iconSvg('trash'),'delete-obligation','btn btn-small btn-danger',`data-id="${o.id}" title="Hapus"`)}</div></div></div>`}
function planningHtml(){const obligations=[...openObligations()].sort((a,b)=>(a.dueDate||'9999').localeCompare(b.dueDate||'9999'));const annual=data.annualCosts;const goals=data.goals.filter(g=>g.active!==false);const recurring=data.recurringIncome;return `<div class="section-heading" style="margin-top:0"><div><h2>Tujuan tabungan</h2><p>Tabungan yang ditandai tetap bagian dari saldo, tetapi tidak dianggap uang bebas dipakai.</p></div>${btn('Tambah tujuan','add-goal','btn btn-primary')}</div><div class="grid grid-3">${goals.length?goals.map(g=>{const saved=Number(g.contributed)||0,target=Number(g.target)||0,pct=target?clamp(saved/target*100,0,100):0;return `<div class="card"><div class="card-title-row"><div><h3 class="card-title">${escapeHtml(g.name)}</h3><p class="card-subtitle">${g.deadline?`Target ${fmtDate(g.deadline)}`:'Tanpa tenggat'} · prioritas ${escapeHtml(g.priority||'normal')}</p></div><div class="progress-ring" style="--p:${pct}%" data-value="${Math.round(pct)}%"></div></div><div class="metric-value" style="font-size:20px;margin:5px 0">${m(saved)} <span class="small-muted" style="font-size:11px;font-weight:500">dari ${m(target)}</span></div><div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div><div class="small-muted" style="margin-top:9px">${target>saved?`Masih perlu ${m(target-saved)}`:'Target tercapai, selamat!'}</div><div class="form-actions" style="margin-top:12px">${btn('Tambah tabungan','contribute-goal','btn btn-small',`data-id="${g.id}"`)}${btn('Ambil kembali','withdraw-goal','btn btn-small',`data-id="${g.id}"`)}${btn('Ubah','edit-goal','btn btn-small',`data-id="${g.id}"`)}${btn('Hapus','delete-goal','btn btn-small btn-danger',`data-id="${g.id}"`)}</div></div>`}).join(''):empty('Belum ada tujuan tabungan','Buat tujuan; Siklus akan menandai nominalnya, bukan memindahkan uang secara otomatis.',btn('Buat tujuan','add-goal','btn btn-primary'))}</div>
<div class="section-heading"><div><h2>Kebutuhan yang belum dibayar</h2><p>Masuk perhitungan uang aman dipakai, tetapi belum jadi pengeluaran aktual.</p></div>${btn('Tambah kebutuhan','add-obligation','btn btn-primary')}</div><div class="card">${obligations.length?`<div class="list">${obligations.map(obligationCard).join('')}</div>`:empty('Tidak ada tagihan terbuka','Catat tagihan tetap, pembelian mendatang, atau kebutuhan tahunan.',btn('Tambah kebutuhan','add-obligation','btn btn-small'))}</div>

function assistantHtml(){return `<div class="grid grid-2"><div class="card"><div class="card-title-row"><div><h2 class="card-title">Pendamping keuangan</h2><p class="card-subtitle">AI opsional untuk membahas pola pengeluaran dan menyiapkan rencana.</p></div><span class="pill">Perlu backend</span></div><div class="banner warn">${iconSvg('shield')}<div><strong>Privasi adalah pilihanmu.</strong><div style="margin-top:3px">Saat pertanyaan dikirim, ringkasan transaksi dan pesanmu dapat dikirim ke alamat backend yang disetel. Jangan gunakan fitur ini sebelum memahami backend dan aturan datanya. AI tidak boleh memindahkan uang, mengubah anggaran, atau menghapus catatan.</div></div></div><div class="field" style="margin-top:15px"><label for="aiGateToken">Token akses backend (sesi ini saja)</label><input class="input" id="aiGateToken" type="password" autocomplete="off" placeholder="Masukkan token yang disetel di backend" value=""><small>Token tidak disimpan ke cadangan atau localStorage. Masukkan kembali setelah membuka ulang aplikasi.</small></div><div class="field" style="margin-top:15px"><label for="aiPrompt">Apa yang ingin kamu pahami?</label><textarea id="aiPrompt" placeholder="Contoh: bantu saya memahami pengeluaran yang paling bisa dikurangi tanpa memotong kebutuhan penting."></textarea></div><label class="field-check" style="margin-top:12px"><input id="aiConsent" type="checkbox"><span>Saya mengerti bahwa pesan dan ringkasan keuangan akan dikirim ke backend AI yang saya atur, dan saya menyetujuinya untuk pertanyaan ini.</span></label><div class="form-actions" style="margin-top:14px">${btn('Kirim pertanyaan','ask-ai','btn btn-primary')}${btn('Hapus percakapan','clear-ai-chat','btn btn-small')}</div><div id="aiStatus" class="small-muted" style="margin-top:12px">${data.settings.aiEndpoint?'Backend sudah diisi. Periksa bahwa endpoint memang kamu kendalikan.':'Belum ada backend. Atur alamat backend di Pengaturan untuk mengaktifkan.'}</div></div><div class="card"><div class="card-title-row"><div><h2 class="card-title">Percakapan sesi ini</h2><p class="card-subtitle">Pesan tidak disimpan ke catatan keuangan.</p></div></div><div id="aiMessages" class="list">${assistantMessages.length?assistantMessages.map(msg=>`<div class="list-row"><div class="row-icon">${iconSvg(msg.role==='user'?'note':'spark')}</div><div class="row-main"><div class="row-title">${msg.role==='user'?'Kamu':'Pendamping'}</div><div class="note-card-body">${escapeHtml(msg.text)}</div></div></div>`).join(''):empty('Belum ada percakapan','Analisis lokal di Ringkasan dan Laporan tetap bekerja walaupun AI mati.')}</div><div class="divider"></div><div class="eyebrow">Ringkasan lokal untuk konteksmu</div><div class="list" style="margin-top:9px"><div class="list-row"><div class="row-main"><div class="row-title">Uang aman dipakai</div><div class="row-desc">${m(safeMoney())}</div></div></div><div class="list-row"><div class="row-main"><div class="row-title">Pengeluaran bulan ini</div><div class="row-desc">${m(expensesInRange(startOfMonth(thisMonth()),endOfMonth(thisMonth())))}</div></div></div><div class="list-row"><div class="row-main"><div class="row-title">Data belum lengkap?</div><div class="row-desc">${data.transactions.length?'Periksa juga transaksi tanpa kategori dan tanggal mulai pencatatan.':'Belum ada transaksi; saran khusus belum dapat dibuat.'}</div></div></div></div></div></div>`}

const txTypes=[['income','Pemasukan'],['expense','Pengeluaran'],['transfer','Pindah uang antar akun'],['refund','Pengembalian uang'],['borrow','Menerima pinjaman'],['debtPayment','Bayar pinjaman'],['lend','Meminjamkan uang'],['lendReturn','Menerima pengembalian piutang'],['creditExpense','Belanja dengan kartu kredit / PayLater'],['creditPayment','Bayar kartu kredit / PayLater'],['correction','Koreksi saldo (butuh konfirmasi)']];
function transactionForm(t=null){const draft=!t?data.drafts.transaction||{}:{};const v=k=>t?.[k]??draft[k]??'';const type=v('type')||'expense';const catList=type==='income'?incomeCats():expenseCats();const date=v('date')||today();const isEdit=!!t;let txName=v('name'),amount=v('amount'),note=v('note');const liabilities=data.liabilities.map(l=>({value:l.id,label:l.name+` (sisa ${fmt(liabilityRemaining(l))})`}));const receivables=data.receivables.map(r=>({value:r.id,label:r.name+` (sisa ${fmt(receivableRemaining(r))})`}));const originals=data.transactions.filter(x=>['expense','creditExpense'].includes(x.type)&&refundAmountFor(x)<Number(x.amount||0)).map(x=>({value:x.id,label:`${x.name||txLabel(x)} · ${fmtDate(getTxDate(x))} · ${fmt(Number(x.amount)-refundAmountFor(x))} belum kembali`}));return `<input type="hidden" name="id" value="${escapeHtml(t?.id||'')}"><div class="form-grid"><div class="field full"><label for="txType">Jenis transaksi</label><select class="input" id="txType" name="type" ${isEdit?'disabled':''}>${txTypes.map(([value,label])=>`<option value="${value}" ${type===value?'selected':''}>${label}</option>`).join('')}</select>${isEdit?`<input type="hidden" name="type" value="${escapeHtml(type)}">`:''}</div><div class="field full" data-for="amount"><label for="txAmount">Nominal (Rp)</label><input class="input" id="txAmount" name="amount" type="number" min="1" step="1" required value="${escapeHtml(amount)}" placeholder="Contoh: 25000"></div>${field('Nama singkat','txName',`<input class="input" id="txName" name="name" maxlength="100" value="${escapeHtml(txName)}" placeholder="Contoh: Makan siang">`,'full')}${field('Tanggal kejadian','txDate',`<input class="input" id="txDate" name="date" type="date" required value="${escapeHtml(date)}"><small>Tanggal ini dipakai dalam laporan. Waktu pencatatan disimpan terpisah.</small>`)}<div class="field" data-for="category"><label for="txCategoryField">Kategori</label><select class="input" id="txCategoryField" name="category"><option value="Belum dikategorikan" ${v('category')==='Belum dikategorikan'?'selected':''}>Belum dikategorikan</option>${[...new Set([...catList,...expenseCats(),...incomeCats()])].map(c=>`<option value="${escapeHtml(c)}" ${v('category')===c?'selected':''}>${escapeHtml(c)}</option>`).join('')}</select></div><div class="field full" data-for="splits"><label for="txSplits">Bagi ke beberapa kategori (opsional)</label><textarea class="input" id="txSplits" name="splitsText" placeholder="Makan & minum=20000\nTransportasi=15000">${escapeHtml(Array.isArray(v('splits'))?v('splits').map(s=>`${s.category}=${s.amount}`).join('\n'):v('splitsText')||'')}</textarea><small>Satu kategori per baris, format Nama kategori=nominal. Jumlah semua baris harus sama persis dengan nominal transaksi.</small></div>${field('Akun','txAccount',`<select class="input" id="txAccount" name="accountId">${accountOptions(v('accountId')||'cash')}</select>`,'')}${field('Status transaksi','txStatusField',`<select class="input" id="txStatusField" name="status"><option value="paid" ${v('status')!=='pending'?'selected':''}>Sudah terjadi / selesai</option><option value="pending" ${v('status')==='pending'?'selected':''}>Menunggu konfirmasi</option></select><small>Transaksi menunggu belum mengubah saldo aktual.</small>`)}<div class="field" data-for="transferFrom"><label for="txTransferFrom">Dari akun</label><select class="input" id="txTransferFrom" name="fromAccountId">${accountOptions(v('fromAccountId')||'cash')}</select></div><div class="field" data-for="transferTo"><label for="txTransferTo">Ke akun</label><select class="input" id="txTransferTo" name="toAccountId">${accountOptions(v('toAccountId')||data.accounts.find(a=>a.id!=='cash')?.id||'cash')}</select></div><div class="field" data-for="liability"><label for="txLiability">Kewajiban yang terkait</label><select class="input" id="txLiability" name="liabilityId"><option value="">Buat kewajiban baru / tidak dipilih</option>${liabilities.map(x=>`<option value="${ function updateTxConditionals(){const type=$('#txType')?.value||'expense';const show={amount:type!=='correction',splits:['expense','creditExpense'].includes(type),category:['income','expense','creditExpense','refund'].includes(type),account:!['transfer'].includes(type),transferFrom:type==='transfer',transferTo:type==='transfer',liability:['borrow','debtPayment','creditExpense','creditPayment'].includes(type),liabilityName:['borrow','creditExpense'].includes(type),receivable:['lend','lendReturn'].includes(type),receivableName:type==='lend',refundOriginal:type==='refund',correction:type==='correction',status:true};$$('[data-for]').forEach(el=>{const key=el.dataset.for;el.classList.toggle('hidden',show[key]===false||show[key]===undefined)});const amt=$('#txAmount')?.closest('[data-for="amount"]');if(amt)amt.classList.toggle('hidden',type==='correction');if($('#txAmount'))$('#txAmount').required=type!=='correction';if($('#txSignedAmount'))$('#txSignedAmount').required=type==='correction';const cat=$('#txCategoryField')?.closest('[data-for="category"]');if(cat)cat.classList.toggle('hidden',!show.category);const acct=$('#txAccount')?.closest('.field');if(acct)acct.classList.toggle('hidden',!show.account);}

function addProfilePhoto(file){return new Promise((resolve,reject)=>{if(!file||!file.type.startsWith('image/'))return reject(new Error('Pilih file gambar.'));const img=new Image(),url=URL.createObjectURL(file);img.onload=()=>{try{const max=512,scale=Math.min(1,max/Math.max(img.width,img.height));const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));const ctx=canvas.getContext('2d');ctx.drawImage(img,0,0,canvas.width,canvas.height);let q=.8,encoded=canvas.toDataURL('image/jpeg',q);while(encoded.length>300*1024*1.37&&q>.35){q-=.1;encoded=canvas.toDataURL('image/jpeg',q)}if(encoded.length>300*1024*1.37)throw new Error('Foto terlalu besar setelah diperkecil. Coba gambar lain.');resolve(encoded)}catch(e){reject(e)}finally{URL.revokeObjectURL(url)}};img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('Foto tidak bisa dibaca.'))};img.src=url})}
function persistTransactionDraft(){const form=$('#modalForm');if(form?.dataset.form!=='transaction'||form.dataset.editId)return;const fd=new FormData(form),obj={};for(const [k,v] of fd.entries())if(k!=='txReceipt')obj[k]=v;data.drafts.transaction=obj;try{if(!unsafeStorage)localStorage.setItem(STORAGE_KEY,JSON.stringify(data))}catch(e){}}
function refreshRecurringNotes(){for(const n of data.notes){if(n.type!=='essential'||!n.recurrence||n.recurrence==='none')continue;const period=n.recurrence==='daily'?today():thisMonth();if(!n.period)n.period=period;if(n.period!==period){if(n.mode==='history'){n.history=n.history||{};n.history[n.period]=JSON.parse(JSON.stringify(n.checklist||[]))}n.checklist=(n.checklist||[]).map(i=>({...i,done:false}));n.period=period;n.updatedAt=new Date().toISOString()}}}
function nextDueDate(date,frequency){if(!date)return '';const d=new Date(date+'T12:00:00');if(frequency==='weekly')d.setDate(d.getDate()+7);else if(frequency==='yearly')d.setFullYear(d.getFullYear()+1);else d.setMonth(d.getMonth()+1);return localDate(d)}
function makeTxId(){return uid()}
function transactionBalanceChange(t){const a=Number(t.amount)||0;if(isPending(t))return 0;switch(t.type){case'income':case'refund':case'borrow':case'lendReturn':return a;case'expense':case'debtPayment':case'lend':case'creditPayment':return -a;case'transfer':return 0;case'correction':return Number(t.signedAmount)||0;default:return 0}}
function exportJson(){if(unsafeStorage){showToast('Pulihkan data cadangan terlebih dahulu; penyimpanan yang tidak terbaca tidak akan ditimpa.');return}const original=JSON.stringify(data);const copy=JSON.parse(original);const photos=copy.transactions.filter(t=>t.receiptData).length;if(photos&&!confirm(`Ada ${photos} foto struk. Tekan OK untuk menyertakan foto; Cancel untuk membuat cadangan tanpa foto agar file lebih kecil.`)){copy.transactions=copy.transactions.map(t=>{if(t.receiptData){delete t.receiptData;t.receiptOmittedInBackup=true}return t})}copy.settings.lastBackupAt=new Date().toISOString();data.settings.lastBackupAt=copy.settings.lastBackupAt;save();downloadBlob(JSON.stringify(copy,null,2),`siklus-cadangan-${today()}.json`,'application/json');logChange('Membuat cadangan JSON',`${copy.transactions.length} transaksi`);save();render();showToast('Cadangan JSON berhasil dibuat. Simpan file di luar browser.')}
function downloadBlob(text,filename,type){const blob=new Blob([text],{type});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500)}
function csvCell(value){let s=String(value??'');if(/^[=+@\-]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'}
function exportCsv(){const rows=[['Tanggal','Nama','Jenis','Kategori','Nominal','Status','Akun','Catatan','ID transaksi']];let chosen=[...data.transactions];let suffix='transaksi';if(activeView==='transactions'){chosen=filteredTxs();suffix='hasil-pencarian'}else if(activeView==='reports'){const [from,to]=selectedReportRange();chosen=chosen.filter(t=>getTxDate(t)>=from&&getTxDate(t)<=to);suffix='laporan'}for(const t of chosen.sort((a,b)=>getTxDate(a).localeCompare(getTxDate(b))))rows.push([getTxDate(t),t.name||txLabel(t),txLabel(t),(t.category||''),t.type==='correction'?t.signedAmount:t.amount,t.status==='pending'?'Menunggu':'Tercatat',account(t.accountId)?.name||'',t.note||'',t.id]);downloadBlob('\ufeff'+rows.map(r=>r.map(csvCell).join(',')).join('\r\n'),`siklus-${suffix}-${today()}.csv`,'text/csv;charset=utf-8');showToast(`File CSV berhasil dibuat (${Math.max(0,rows.length-1)} transaksi).`)}

function markObligationPaid(id,amount,date,accountId,note){const o=data.obligations.find(x=>x.id===id);if(!o||o.status==='paid')return;const value=Math.round(Number(amount)||0);if(value<=0)return;const tx={id:makeTxId(),type:'expense',name:o.name,amount:value,date,category:o.category||'Tagihan',accountId:accountId||'cash',status:'paid',note:note||`Pembayaran kebutuhan${o.isEstimate?' (nominal aktual)':''}`,obligationId:o.id,createdAt:new Date().toISOString()};if(value>balanceForAccount(accountId||'cash')&&!confirm(`Pembayaran ini melebihi saldo akun ${account(accountId||'cash')?.name||'pilihan'} yang tercatat (${fmt(balanceForAccount(accountId||'cash'))}). Saldo akun akan menjadi negatif. Tetap catat?`))return;data.transactions.push(tx);o.status='paid';o.paidAmount=value;o.paidTransactionId=tx.id;o.paidAt=new Date().toISOString();if(o.recurring&&o.frequency!=='none'){const next=nextDueDate(o.dueDate||date,o.frequency);data.obligations.push({...o,id:uid(),dueDate:next,status:'unpaid',paidAmount:0,paidTransactionId:null,createdAt:new Date().toISOString()})}logChange('Mencatat pembayaran',`${o.name}: ${value}`);commit('Pembayaran dicatat sebagai pengeluaran.')}
function removeTransaction(id){const t=data.transactions.find(x=>x.id===id);if(!t)return;if(['expense','creditExpense'].includes(t.type)&&data.transactions.some(x=>x.type==='refund'&&x.originalTransactionId===id)){showToast('Transaksi ini masih menjadi asal pengembalian uang. Hapus catatan pengembalian terkait terlebih dahulu agar riwayat tidak terputus.');return}const highImpact=['borrow','debtPayment','lend','lendReturn','creditExpense','creditPayment','transfer','correction','refund'].includes(t.type);if(!confirm(`Hapus “${t.name||txLabel(t)}” sebesar ${fmt(t.type==='correction'?t.signedAmount:t.amount)}?${highImpact?'\n\nTransaksi ini memengaruhi saldo, utang/piutang, pengembalian, atau transfer. Data terkait akan dihitung ulang.':''}\n\nKamu bisa memakai “Urungkan” setelah menghapus.`))return;const idx=data.transactions.findIndex(x=>x.id===id);const removed=data.transactions.splice(idx,1)[0];if(removed.obligationId){const o=data.obligations.find(x=>x.id===removed.obligationId);if(o&&o.paidTransactionId===id){o.status='unpaid';delete o.paidTransactionId;delete o.paidAmount;delete o.paidAt}}logChange('Menghapus transaksi',`${removed.name||txLabel(removed)}: ${removed.amount}`);save();render();showToast('Transaksi dihapus.',()=>{data.transactions.splice(Math.min(idx,data.transactions.length),0,removed);if(removed.obligationId){const o=data.obligations.find(x=>x.id===removed.obligationId);if(o){o.status='paid';o.paidTransactionId=removed.id;o.paidAmount=removed.amount}}logChange('Mengurungkan hapus transaksi',removed.name||txLabel(removed));save();render();showToast('Transaksi berhasil dipulihkan.')})}
function deleteGeneric(collection,id,label){const arr=data[collection];const idx=arr.findIndex(x=>x.id===id);if(idx<0)return;const item=arr[idx];if(!confirm(`Hapus ${label||item.name||item.title||'item'}?`))return;arr.splice(idx,1);logChange(`Menghapus ${label||'data'}`,item.name||item.title||id);save();render();showToast(`${label||'Data'} dihapus.`,()=>{arr.splice(idx,0,item);save();render();showToast('Data berhasil dipulihkan.')})}

let formBusy=false;
async function submitTransaction(form){const fd=new FormData(form);const oldId=form.dataset.editId||fd.get('id')||'';const existing=oldId?data.transactions.find(t=>t.id===oldId):null;const type=String(fd.get('type')||'expense');let amount=Math.round(Number(fd.get('amount'))||0);let signedAmount=Math.round(Number(fd.get('signedAmount'))||0);if(type==='correction'){if(!signedAmount)throw new Error('Masukkan nilai koreksi selain nol.');amount=Math.abs(signedAmount)}else if(!Number.isFinite(amount)||amount<=0||amount>1e15)throw new Error('Nominal harus lebih besar dari nol dan masih dalam batas wajar.');const date=String(fd.get('date')||today());if(!isValidISODate(date))throw new Error('Tanggal transaksi tidak valid.');if(date>localDate(new Date(Date.now()+365*86400000))&&!confirm('Tanggal ini jauh di masa depan. Tetap simpan?'))throw new Error('Penyimpanan dibatalkan.');let status=fd.get('status')==='pending'?'pending':'paid';let accountId=String(fd.get('accountId')||'cash'),fromAccountId=String(fd.get('fromAccountId')||''),toAccountId=String(fd.get('toAccountId')||'');if(type==='transfer'){if(!account(fromAccountId)||!account(toAccountId)||fromAccountId===toAccountId)throw new Error('Pilih dua akun yang berbeda untuk transfer.');accountId=''}else if(type!=='correction'&&!account(accountId))throw new Error('Akun transaksi tidak ditemukan.');if(existing&&data.transactions.some(x=>x.type==='refund'&&x.originalTransactionId===existing.id)&&(!['expense','creditExpense'].includes(type)||sum(data.transactions.filter(x=>x.type==='refund'&&x.originalTransactionId===existing.id&&x.id!==oldId).map(x=>Number(x.amount)||0))>amount))throw new Error('Transaksi ini punya pengembalian terkait. Nominal asal tidak boleh lebih kecil dari total pengembalian, dan jenisnya harus tetap pengeluaran.');if(type==='refund'){const origId=String(fd.get('originalTransactionId')||'');if(!origId)throw new Error('Pilih transaksi pengeluaran asal agar pengembalian tercatat dengan benar.');const orig=originalTx(origId);if(!orig||!['expense','creditExpense'].includes(orig.type))throw new Error('Transaksi asal pengembalian tidak ditemukan.');const otherRefunds=sum(data.transactions.filter(x=>x.type==='refund'&&x.originalTransactionId===orig.id&&x.id!==oldId&&!isPending(x)).map(x=>Number(x.amount)||0));if(status!=='pending'&&otherRefunds+amount>Number(orig.amount||0))throw new Error(`Pengembalian tidak boleh melebihi sisa pengeluaran yang belum dikembalikan (${fmt(Number(orig.amount)-otherRefunds)}).`);}
if(['debtPayment','creditPayment'].includes(type)){const lid=String(fd.get('liabilityId')||existing?.liabilityId||'');if(!lid||!data.liabilities.some(l=>l.id===lid))throw new Error('Pilih utang atau kewajiban yang akan dibayar.');const l=data.liabilities.find(x=>x.id===lid),current=liabilityRemaining(l)+(existing&&existing.liabilityId===lid&&['debtPayment','creditPayment'].includes(existing.type)?Number(existing.amount)||0:0);if(status!=='pending'&&amount>current&&!confirm(`Pembayaran ${fmt(amount)} lebih besar daripada sisa kewajiban ${fmt(current)}. Sisa akan menjadi nol, tetapi kelebihan tetap mengurangi saldo. Lanjutkan?`))throw new Error('Penyimpanan dibatalkan.');}

.includes(original.type))throw new Error('Pengembalian harus tertaut ke transaksi pengeluaran asal yang valid. Cadangan tidak diimpor.')}}for(const c of ['expense','income']){if(!Array.isArray(safe.categories[c])||safe.categories[c].some(x=>typeof x!=='string'||!x.trim()||x.length>60))throw new Error('Daftar kategori tidak valid. Cadangan tidak diimpor.')}for(const n of safe.notes){if(!['dashboard','essential','free'].includes(n.type)||typeof n.title!=='string'||n.title.length>160)throw new Error('Ada catatan dengan jenis atau judul yang tidak valid. Cadangan tidak diimpor.')}if(safe.settings.profileImage&&!/^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(safe.settings.profileImage))safe.settings.profileImage='';for(const t of safe.transactions){if(t.receiptData&&!/^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(t.receiptData))delete t.receiptData}safe.settings.lastBackupAt=safe.settings.lastBackupAt||'';data=safe;unsafeStorage=false;logChange('Memulihkan cadangan JSON',`${data.transactions.length} transaksi`);const ok=save();if(!ok){data=previousData;unsafeStorage=previousUnsafe;throw new Error('Browser tidak berhasil menyimpan cadangan yang diimpor. Data saat ini dipulihkan di layar; coba lagi atau periksa ruang penyimpanan.')}navigate('dashboard');showToast('Cadangan berhasil diperiksa dan dipulihkan.')}catch(e){showToast(e.message||'File tidak dapat dipulihkan. Data saat ini tidak diubah.')}finally{const input=$('#importJsonInput');if(input)input.value=''}};reader.onerror=()=>showToast('File tidak dapat dibaca.');reader.readAsText(file)}

// Navigation, actions, and modal controls use delegated handlers so all rendered pages stay interactive.
document.addEventListener('click',e=>{const nav=e.target.closest('[data-view]');if(nav){navigate(nav.dataset.view);return}const close=e.target.closest('[data-close-modal]');if(close){closeForm();return}if(e.target===$('#modalBackdrop')){closeForm();return}if(e.target===$('#mobileMenu')||e.target.closest('#mobileMenu')){$('#sidebar').classList.toggle('open');return}if(e.target===$('#hideAmountsBtn')||e.target.closest('#hideAmountsBtn')){data.settings.hideAmounts=!data.settings.hideAmounts;save();render();return}if(e.target===$('#quickAdd')||e.target.closest('#quickAdd')){runAction('add-transaction');return}if(e.target===$('#toastAction')||e.target.closest('#toastAction')){const fn=undoAction;undoAction=null;$('#toast').classList.remove('show');if(fn)fn();return}const act=e.target.closest('[data-act]');if(!act)return;if(act.dataset.act==='toggle-check')return;try{navigateAction(act.dataset.act);if(['goto-reports','goto-budgets','goto-planning','goto-transactions','goto-notes','goto-simulation','goto-assistant'].includes(act.dataset.act))return;runAction(act.dataset.act,act)}catch(err){showToast(err.message||'Aksi belum bisa dilakukan.')}});
document.addEventListener('change',e=>{const el=e.target;if(el.matches('[data-dashboard-section]')){const key=el.dataset.dashboardSection;if(Object.prototype.hasOwnProperty.call(data.settings.dashboardSections,key)){data.settings.dashboardSections[key]=!!el.checked;save();render()}return}if(el.matches('#txType')){updateTxConditionals();return}if(el.matches('#txOriginal')){const orig=originalTx(el.value);const cat=$('#txCategoryField');if(orig&&cat){const suggested=Array.isArray(orig.splits)&&orig.splits.length?orig.splits[0].category:orig.category;if([...cat.options].some(o=>o.value===suggested))cat.value=suggested}return}if(el.matches('#txFilterType')){txFilters.type=el.value;keepFocusRender(el);return}if(el.matches('#txStatus')){txFilters.status=el.value;keepFocusRender(el);return}if(el.matches('#txCategory')){txFilters.category=el.value;keepFocusRender(el);return}if(el.matches('#txFrom')){txFilters.from=el.value;keepFocusRender(el);return}if(el.matches('#txTo')){txFilters.to=el.value;keepFocusRender(el);return}if(el.matches('#noteSort')){notesSort=el.value;render();return}if(el.matches('#reportFrom,#reportTo')){render();return}if(el.matches('#profilePhoto')){const f=el.files?.[0];if(!f)return;addProfilePhoto(f).then(img=>{data.settings.profileImage=img;save();render();showToast('Foto profil disimpan setelah diperkecil.')}).catch(err=>showToast(err.message||'Foto gagal diproses.'));return}if(el.matches('#importJsonInput')){handleImportFile(el.files?.[0]);return}if(el.matches('#noteSearch')){notesQuery=el.value;keepFocusRender(el);return}});
document.addEventListener('input',e=>{const el=e.target;if(el.matches('#aiGateToken')){aiGateToken=String(el.value||'');return}if(el.matches('#txSearch')){txFilters.q=el.value;keepFocusRender(el);return}if(el.matches('#noteSearch')){notesQuery=el.value;keepFocusRender(el);return}if(el.closest('#modalForm')&&$('#modalForm').dataset.form==='transaction'&&!$('#modalForm').dataset.editId){persistTransactionDraft()}});
document.addEventListener('change',e=>{const el=e.target;if(el.matches('input[data-act="toggle-check"]')){runAction('toggle-check',el)}});
$('#modalForm').addEventListener('submit',handleFormSubmit);$('#modalBackdrop').addEventListener('click',e=>{if(e.target===$('#modalBackdrop'))closeForm()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#modalBackdrop').classList.contains('open'))closeForm()});
// Settings form is rendered dynamically; listen on the document.
document.addEventListener('submit',e=>{if(e.target.id==='settingsPlanForm'){handleSettingsPlan(e)}if(e.target.id==='simulationForm'){e.preventDefault();const extra=Math.max(0,Number($('#simExtraExpense').value)||0),cut=Math.max(0,Number($('#simCutExpense').value)||0),savings=Math.max(0,Number($('#simSavings').value)||0),debt=Math.max(0,Number($('#simDebt').value)||0),months=Math.max(1,Number($('#simMonths').value)||1);const available=rawSafeMoney();const debtBeyondRecorded=Math.max(0,debt-totalLiabilities());const immediate=available-savings-debtBeyondRecorded;const monthlyChange=cut-extra;const after=immediate+monthlyChange*months;const deficit=Math.max(0,savings+debtBeyondRecorded-available);$('#simulationResult').innerHTML=`<div class="eyebrow">Hasil skenario</div><div class="metric-value" style="color:${after<0?'var(--red)':'var(--text)'}">${m(Math.max(0,after))}</div><div class="metric-note">Perkiraan uang aman dipakai setelah ${months} bulan, jika asumsi skenario terjadi.</div><div class="divider"></div><div class="list"><div class="list-row"><div class="row-main"><div class="row-title">Uang aman awal</div></div><div class="row-amount">${m(available)}</div></div><div class="list-row"><div class="row-main"><div class="row-title">Penanda tabungan</div></div><div class="row-amount amount-negative">−${m(savings)}</div></div><div class="list-row"><div class="row-main"><div class="row-title">Dampak bersih pembayaran utang</div><div class="row-desc">Pelunasan mengurangi uang dan utang sekaligus. Hanya kelebihan dari total utang tercatat yang mengurangi uang aman.</div></div><div class="row-amount ${debtBeyondRecorded?'amount-negative':''}">${debtBeyondRecorded?'−':''}${m(debtBeyondRecorded)}</div></div><div class="list-row"><div class="row-main"><div class="row-title">Dampak bulanan bersih</div><div class="row-desc">Pengurangan belanja fleksibel dikurangi belanja tambahan</div></div><div class="row-amount ${monthlyChange>=0?'amount-positive':'amount-negative'}">${monthlyChange>=0?'+':'−'}${m(Math.abs(monthlyChange)*months)}</div></div></div>${after<0?`<div class="banner danger" style="margin-top:14px">${iconSvg('help')}<div><strong>Skenario ini melebihi uang aman.</strong><div style="margin-top:3px">Perkiraan kekurangan ${m(Math.abs(after))}. Kurangi nominal, ubah jangka waktu, atau tinjau kebutuhan terlebih dahulu. Ini bukan saran untuk memotong kebutuhan pokok.</div></div></div>`:`<div class="banner" style="margin-top:14px">${iconSvg('check')}<div><strong>Angka ini hanya skenario.</strong><div style="margin-top:3px">Belum mencakup perubahan pendapatan, biaya tak terduga, atau seluruh variasi masa depan. Data asli tidak berubah.</div></div></div>`}${deficit?`<div class="small-muted" style="margin-top:9px">Catatan: dana langsung yang dibutuhkan lebih besar daripada uang aman awal sekitar ${m(deficit)}.</div>`:''}`;}});

if('serviceWorker' in navigator && (location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1')){navigator.serviceWorker.register('./sw.js').catch(()=>{});}
window.addEventListener('beforeunload',()=>{if(!unsafeStorage)save()});
start();
})();
